---
argument_specs:
  main:
    short_description: Entry point for the memcached role.
    description:
    - Validate variables for the `memcached` role.
    options:
      memcached_verbose:
        description:
        - Verbose.
        required: false
        type: bool
      memcached_memory:
        description:
        - Memory.
        required: false
        type: int
      memcached_port:
        description:
        - Port.
        required: false
        type: int
      memcached_user:
        description:
        - User.
        required: false
        type: str
      memcached_listen:
        description:
        - Listen.
        required: false
        type: list
        elements: str
      memcached_maxconn:
        description:
        - Maxconn.
        required: false
        type: int
      memcached_extra_options:
        description:
        - Extra options.
        required: false
        type: list
        elements: str
      memcached_manage_service:
        description:
        - Manage service.
        required: false
        type: bool
      memcached_service_enabled:
        description:
        - Service enabled.
        required: false
        type: bool
      memcached_service_state:
        description:
        - Service state.
        required: false
        type: str
        choices:
        - started
        - stopped
      memcached_manage_firewall:
        description:
        - Manage firewall.
        required: false
        type: bool
      memcached_firewall_sources:
        description:
        - Firewall sources.
        required: false
        type: list
        elements: str
      memcached_packages:
        description:
        - Packages.
        required: false
        type: list
        elements: str
