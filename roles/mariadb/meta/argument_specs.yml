---
argument_specs:
  main:
    short_description: Entry point for the mariadb role.
    description:
    - Validate variables for the `mariadb` role.
    options:
      mariadb_version:
        description:
        - Version.
        required: false
        type: str
      mariadb_debug:
        description:
        - Debug.
        required: false
        type: bool
      mariadb_mirror_base_url:
        description:
        - Mirror base url.
        required: false
        type: str
      mariadb_create_directories:
        description:
        - Create directories.
        required: false
        type: bool
      mariadb_dirs:
        description:
        - Dirs.
        required: false
        type: list
        elements: dict
        options:
          path:
            type: str
            description:
            - Path.
            required: true
          owner:
            type: str
            description:
            - Owner.
          group:
            type: str
            description:
            - Group.
          mode:
            type: str
            description:
            - Mode.
      mariadb_manage_pip_dependencies:
        description:
        - Manage pip dependencies.
        required: false
        type: bool
      mariadb_packages_extra:
        description:
        - Packages extra.
        required: false
        type: list
        elements: str
      mariadb_http_pkg_proxy:
        description:
        - Http pkg proxy.
        required: false
        type: str
      mariadb_https_pkg_proxy:
        description:
        - Https pkg proxy.
        required: false
        type: str
      mariadb_admin_home:
        description:
        - Admin home.
        required: false
        type: str
      mariadb_admin_user:
        description:
        - Admin user.
        required: false
        type: str
      mariadb_admin_password:
        description:
        - Admin password.
        required: false
        type: str
        no_log: true
      mariadb_admin_force_password_update:
        description:
        - Admin force password update.
        required: false
        type: bool
      mariadb_overwrite_global_mycnf:
        description:
        - Overwrite global mycnf.
        required: false
        type: bool
      mariadb_config_include_dir:
        description:
        - Config include dir.
        required: false
        type: str
      mariadb_config_include_files:
        description:
        - Config include files.
        required: false
        type: list
        elements: dict
        options:
          src:
            type: str
            description:
            - Src.
            required: true
          force:
            type: bool
            description:
            - Force.
      mariadb_users_default_host:
        description:
        - Users default host.
        required: false
        type: str
      mariadb_users:
        description:
        - Users.
        required: false
        type: list
        elements: dict
        options:
          name:
            type: str
            description:
            - Name.
            required: true
          host:
            type: str
            description:
            - Host.
          hosts:
            type: list
            description:
            - Hosts.
            elements: str
          password:
            type: str
            description:
            - Password.
            no_log: true
          priv:
            type: str
            description:
            - Priv.
          state:
            type: str
            description:
            - State.
          append_privs:
            type: bool
            description:
            - Append privs.
          encrypted:
            type: bool
            description:
            - Encrypted.
          home:
            type: str
            description:
            - Home.
          copy_cnf:
            type: bool
            description:
            - Copy cnf.
        no_log: true
      mariadb_databases:
        description:
        - Databases.
        required: false
        type: list
        elements: dict
        options:
          name:
            type: str
            description:
            - Name.
            required: true
          state:
            type: str
            description:
            - State.
            choices:
            - present
            - absent
            - dump
            - import
          encoding:
            type: str
            description:
            - Encoding.
          target:
            type: str
            description:
            - Target.
          collation:
            type: str
            description:
            - Collation.
