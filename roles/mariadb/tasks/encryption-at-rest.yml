---
- name: Create protected key directory
  ansible.builtin.file:
    path: '{{ mariadb_file_key_management_dir }}'
    state: directory
    owner: mysql
    group: mysql
    mode: '0700'
- name: Inspect existing encrypted keys
  ansible.builtin.stat:
    path: '{{ _mariadb_file_key_management_filename_path }}'
  register: _mariadb_keys
- name: Create encryption material once
  ansible.builtin.template:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    owner: mysql
    group: mysql
    mode: '0600'
    force: false
  loop:
  - src: keyfile
    dest: '{{ mariadb_file_key_management_dir }}/keyfile'
  - src: keyfile.key.j2
    dest: '{{ _mariadb_file_key_management_filekey_path }}'
  no_log: true
  when: not _mariadb_keys.stat.exists
- name: Encrypt supplied keys without replacing existing key material
  ansible.builtin.command:
    argv:
    - openssl
    - enc
    - -aes-256-cbc
    - -md
    - sha1
    - -in
    - '{{ mariadb_file_key_management_dir }}/keyfile'
    - -pass
    - file:{{ _mariadb_file_key_management_filekey_path }}
    - -out
    - '{{ _mariadb_file_key_management_filename_path }}'
    creates: '{{ _mariadb_file_key_management_filename_path }}'
  no_log: true
- name: Protect encrypted key ownership
  ansible.builtin.file:
    path: '{{ _mariadb_file_key_management_filename_path }}'
    owner: mysql
    group: mysql
    mode: '0600'
- name: Remove plaintext key staging file
  ansible.builtin.file:
    path: '{{ mariadb_file_key_management_dir }}/keyfile'
    state: absent
  no_log: true
- name: Configure selinux
  ansible.builtin.import_tasks: selinux.yml
