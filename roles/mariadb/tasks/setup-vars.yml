---
- name: Reset derived user host mappings
  ansible.builtin.set_fact:
    _mariadb_hosts_patch: []
  no_log: true
- name: Build package proxy environment
  ansible.builtin.set_fact:
    _mariadb_pkg_proxy_env:
      http_proxy: '{{ mariadb_http_pkg_proxy | default(omit, true) }}'
      https_proxy: '{{ mariadb_https_pkg_proxy | default(omit, true) }}'
