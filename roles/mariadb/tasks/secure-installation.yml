---
- name: Remove the anonymous local account
  ansible.mysql.mysql_user:
    name: ''
    host_all: true
    state: absent
    login_unix_socket: '{{ _mariadb_socket }}'
  no_log: true
  when: mariadb_remove_anonymous_users
- name: Remove the distribution test database
  ansible.mysql.mysql_db:
    name: test
    state: absent
    login_unix_socket: '{{ _mariadb_socket }}'
  no_log: true
  when: mariadb_remove_test_database
- name: Set the explicitly supplied local administrator password
  ansible.mysql.mysql_user:
    name: '{{ mariadb_admin_user }}'
    host: localhost
    password: '{{ mariadb_admin_password }}'
    login_unix_socket: '{{ _mariadb_socket }}'
    check_implicit_admin: true
  when: mariadb_admin_force_password_update
  no_log: true
- name: Store explicit administrator credentials
  ansible.builtin.template:
    src: root-my.cnf.j2
    dest: '{{ mariadb_admin_home }}/.my.cnf'
    owner: root
    group: root
    mode: '0600'
  when: mariadb_admin_force_password_update
  no_log: true
