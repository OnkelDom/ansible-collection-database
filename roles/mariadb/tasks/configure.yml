---
- name: Create MariaDB directories
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: directory
    owner: '{{ item.owner | default(''mysql'') }}'
    group: '{{ item.group | default(''mysql'') }}'
    mode: '{{ item.mode | default(''0750'') }}'
  loop: '{{ mariadb_dirs }}'
  when: mariadb_create_directories
- name: Create service override directory
  ansible.builtin.file:
    path: '{{ mariadb_systemd_override_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Configure an explicit journal identifier
  ansible.builtin.copy:
    dest: '{{ mariadb_systemd_override_dir }}/10-degit-syslog.conf'
    content: '[Service]

      SyslogIdentifier={{ mariadb_syslog_tag }}

      '
    owner: root
    group: root
    mode: '0644'
  when: mariadb_syslog_tag | length > 0
  notify:
  - Reload systemd
  - Restart mariadb
- name: Remove a retired owned journal identifier
  ansible.builtin.file:
    path: '{{ mariadb_systemd_override_dir }}/10-degit-syslog.conf'
    state: absent
  when: mariadb_syslog_tag | length == 0
  notify:
  - Reload systemd
  - Restart mariadb
- name: Install the AppArmor-compatible native validator
  ansible.builtin.template:
    src: validate-config.sh.j2
    dest: /usr/local/sbin/degit-mariadb-validate
    owner: root
    group: root
    mode: '0755'
- name: Render validated MariaDB configuration
  ansible.builtin.template:
    src: etc/mysql/my.cnf.j2
    dest: '{{ _mariadb_config_file }}'
    owner: root
    group: mysql
    mode: '0640'
    validate: /usr/local/sbin/degit-mariadb-validate %s
    force: '{{ mariadb_overwrite_global_mycnf }}'
  notify:
  - Restart mariadb
- name: Render explicitly declared configuration snippets
  ansible.builtin.template:
    src: '{{ item.src }}'
    dest: '{{ _mariadb_config_include_dir }}/{{ item.src | basename }}'
    owner: root
    group: mysql
    mode: '0640'
  loop: '{{ mariadb_config_include_files }}'
  notify:
  - Restart mariadb
- name: Configure service limits
  ansible.builtin.template:
    src: etc/systemd/system/mariadb.service.d/override.conf.j2
    dest: '{{ mariadb_systemd_override_dir }}/{{ item.filename }}'
    owner: root
    group: root
    mode: '0644'
  loop: '{{ mariadb_systemd_override }}'
  notify:
  - Reload systemd
  - Restart mariadb
- name: Configure selinux
  ansible.builtin.import_tasks: selinux.yml
- name: Apply requested service state
  ansible.builtin.service:
    name: '{{ _mariadb_daemon }}'
    enabled: '{{ mariadb_service_enabled }}'
    state: '{{ mariadb_service_state }}'
  when: mariadb_manage_service
