---
- name: Reload patroni systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: patroni_manage_service
- name: Restart patroni
  ansible.builtin.systemd_service:
    name: '{{ _patroni_service }}'
    state: restarted
  when:
  - patroni_manage_service
  - patroni_service_state == 'started'
  - _patroni_was_running | default(false)
