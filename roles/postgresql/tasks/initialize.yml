---
- name: Inspect PostgreSQL data version
  ansible.builtin.stat:
    path: '{{ _postgresql_data_dir }}/PG_VERSION'
  register: _postgresql_pgdata_dir_version_res
- name: Require explicit cluster initialization
  ansible.builtin.assert:
    that:
    - _postgresql_pgdata_dir_version_res.stat.exists or (postgresql_initialize | bool)
    fail_msg: Set postgresql_initialize=true for a new empty cluster. Existing data will never be deleted.
- name: Create protected PostgreSQL data directory
  ansible.builtin.file:
    path: '{{ _postgresql_data_dir }}'
    state: directory
    owner: '{{ postgresql_user }}'
    group: '{{ postgresql_group }}'
    mode: '0700'
- name: Initialize Debian standalone cluster
  ansible.builtin.command:
    argv:
    - /usr/bin/pg_createcluster
    - '{{ _postgresql_version }}'
    - '{{ postgresql_cluster_name }}'
    - --datadir
    - '{{ _postgresql_data_dir }}'
    - --
    - --auth-local=peer
    - --auth-host=scram-sha-256
    creates: '{{ _postgresql_data_dir }}/PG_VERSION'
  when: ansible_facts['os_family'] == 'Debian' and not _postgresql_pgdata_dir_version_res.stat.exists
- name: Configure selinux
  ansible.builtin.import_tasks: selinux.yml
- name: Initialize EL standalone cluster
  ansible.builtin.command:
    argv:
    - '{{ _postgresql_bin_path }}/initdb'
    - -D
    - '{{ _postgresql_data_dir }}'
    - --auth-local=peer
    - --auth-host=scram-sha-256
    creates: '{{ _postgresql_data_dir }}/PG_VERSION'
  become: true
  become_user: '{{ postgresql_user }}'
  when: ansible_facts['os_family'] == 'RedHat' and not _postgresql_pgdata_dir_version_res.stat.exists
- name: Read PostgreSQL data version
  ansible.builtin.slurp:
    src: '{{ _postgresql_data_dir }}/PG_VERSION'
  register: _postgresql_data_version
- name: Reject implicit PostgreSQL major upgrades
  ansible.builtin.assert:
    that:
    - (_postgresql_data_version.content | b64decode | trim) == _postgresql_version | string
    fail_msg: Existing cluster major version differs from the selected packages. Plan an explicit upgrade.
