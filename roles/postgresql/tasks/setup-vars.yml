---
- name: Reset derived replication HBA entries
  ansible.builtin.set_fact:
    _postgresql_replication_hba_entries: []
    _postgresql_general_proxy_env:
      http_proxy: '{{ postgresql_http_general_proxy | default(omit, true) }}'
      https_proxy: '{{ postgresql_https_general_proxy | default(omit, true) }}'
    _postgresql_pkg_proxy_env:
      http_proxy: '{{ postgresql_http_pkg_proxy | default(omit, true) }}'
      https_proxy: '{{ postgresql_https_pkg_proxy | default(omit, true) }}'
