---
- name: Create native PostgreSQL service override directory
  ansible.builtin.file:
    path: '{{ _postgresql_service_path }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: ansible_facts['os_family'] == 'RedHat'
- name: Point the native PostgreSQL unit at its explicit data directory
  ansible.builtin.copy:
    dest: '{{ _postgresql_service_path }}/10-degit.conf'
    content: '[Service]

      Environment=PGDATA={{ _postgresql_data_dir }}

      '
    owner: root
    group: root
    mode: '0644'
  when: ansible_facts['os_family'] == 'RedHat'
  notify:
  - Reload systemd
  - Restart postgresql
- name: Install the native PostgreSQL validator
  ansible.builtin.template:
    src: validate-config.sh.j2
    dest: /usr/local/sbin/degit-postgresql-validate
    owner: root
    group: root
    mode: '0755'
- name: Render validated standalone PostgreSQL settings
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: '{{ _postgresql_config_path }}/postgresql.conf'
    owner: '{{ postgresql_user }}'
    group: '{{ postgresql_group }}'
    mode: '0600'
    validate: /usr/local/sbin/degit-postgresql-validate %s
  notify:
  - Restart postgresql
- name: Configure host based authentication (if entries are configured).
  ansible.builtin.template:
    src: '{{ postgresql_hba_template_path }}'
    dest: '{{ _postgresql_config_path }}/pg_hba.conf'
    owner: '{{ postgresql_user }}'
    group: '{{ postgresql_group }}'
    backup: true
    mode: '600'
  diff: true
  notify:
  - Restart postgresql
- name: Ensure PostgreSQL unix socket dirs exist.
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: '{{ postgresql_user }}'
    group: '{{ postgresql_group }}'
    mode: '{{ _postgresql_unix_socket_directories_mode }}'
  loop: '{{ postgresql_unix_socket_directories }}'
- name: Create the managed tmpfiles configuration directory
  ansible.builtin.file:
    path: '{{ postgresql_tempfile_dest_path | dirname }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: postgresql_persist_permissions
- name: Ensure PostgreSQL permissions are persisted accross reboots
  ansible.builtin.template:
    src: '{{ postgresql_tempfile_src_template_path }}'
    dest: '{{ postgresql_tempfile_dest_path }}'
    owner: '{{ postgresql_tempfile_owner }}'
    group: '{{ postgresql_tempfile_group }}'
    mode: '{{ postgresql_tempfile_mode }}'
  when: postgresql_persist_permissions
- name: Configure selinux
  ansible.builtin.import_tasks: selinux.yml
- name: Apply requested service state
  ansible.builtin.service:
    name: '{{ _postgresql_daemon }}'
    enabled: '{{ postgresql_service_enabled }}'
    state: '{{ postgresql_service_state }}'
  when: postgresql_manage_service
