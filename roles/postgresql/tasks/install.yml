---
- name: Create Debian cluster configuration directory
  ansible.builtin.file:
    path: /etc/postgresql-common/createcluster.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: ansible_facts['os_family'] == 'Debian'
- name: Prevent implicit package-time cluster creation
  ansible.builtin.copy:
    dest: /etc/postgresql-common/createcluster.d/99-degit.conf
    content: 'create_main_cluster = false

      '
    owner: root
    group: root
    mode: '0644'
  when: ansible_facts['os_family'] == 'Debian'
- name: Install native PostgreSQL packages on Debian family
  ansible.builtin.apt:
    name: '{{ postgresql_packages | default(_postgresql_packages, true) }}'
    state: present
    policy_rc_d: 101
  when: ansible_facts['os_family'] == 'Debian'
  environment: '{{ _postgresql_pkg_proxy_env }}'
- name: Install native PostgreSQL packages on EL9
  ansible.builtin.dnf:
    name: '{{ postgresql_packages | default(_postgresql_packages, true) }}'
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  environment: '{{ _postgresql_pkg_proxy_env }}'
- name: Generate declared database locales
  community.general.locale_gen:
    name: '{{ item }}'
    state: present
  loop: '{{ postgresql_locales }}'
  when: ansible_facts['os_family'] == 'Debian'
