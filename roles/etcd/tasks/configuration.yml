---
- name: Validate explicit cluster topology and release
  ansible.builtin.assert:
    that:
    - ansible_facts['architecture'] in _etcd_architectures
    - etcd_version in _etcd_checksums
    - etcd_name in etcd_initial_cluster
    - etcd_initial_cluster | length in [1, 3, 5, 7]
    - etcd_initial_cluster_token | length > 0
    - etcd_listen_client_urls | length > 0
    - etcd_advertise_client_urls | length > 0
    - etcd_listen_peer_urls | length > 0
    - etcd_initial_advertise_peer_urls | length > 0
    - etcd_initial_cluster_state in ['new', 'existing']
    - etcd_service_state in ['started', 'stopped']
    - not etcd_manage_firewall or etcd_firewall_sources | length > 0
    - etcd_name is match('^[A-Za-z0-9_-]+$')
    - not etcd_tls_enabled or (etcd_ca_file | length > 0 and etcd_cert_file | length > 0 and etcd_key_file | length > 0 and etcd_peer_ca_file | length > 0 and etcd_peer_cert_file | length > 0 and etcd_peer_key_file | length > 0)
    fail_msg: etcd requires explicit member URLs, pinned release, bootstrap token and TLS material.
    quiet: true
- name: Validate URL transport matches the TLS policy
  ansible.builtin.assert:
    that:
    - item is match(etcd_tls_enabled | ternary('^https://', '^http://'))
  loop: '{{ etcd_listen_client_urls + etcd_advertise_client_urls + etcd_listen_peer_urls + etcd_initial_advertise_peer_urls + etcd_initial_cluster.values() | list }}'
- name: Inspect the etcd member data
  ansible.builtin.stat:
    path: '{{ etcd_data_dir }}/member'
  register: _etcd_member
- name: Require explicit etcd initialization
  ansible.builtin.assert:
    that:
    - _etcd_member.stat.exists or etcd_initialize
    fail_msg: Set etcd_initialize=true only for a planned new member. Existing data is preserved.
- name: Inspect persisted etcd identity
  ansible.builtin.stat:
    path: '{{ etcd_data_dir }}/.degit-etcd'
  register: _etcd_identity
- name: Read persisted etcd identity
  ansible.builtin.slurp:
    src: '{{ etcd_data_dir }}/.degit-etcd'
  register: _etcd_identity_content
  when: _etcd_identity.stat.exists
- name: Reject implicit etcd identity or membership changes
  ansible.builtin.assert:
    that:
    - '_etcd_identity_content.content | b64decode | trim == {"name": etcd_name, "token": etcd_initial_cluster_token, "members": etcd_initial_cluster} | to_json(sort_keys=true)'
    fail_msg: Cluster identity changed. Use an explicit reviewed adoption or membership procedure.
  when: _etcd_identity.stat.exists
- name: Install etcd host prerequisites
  ansible.builtin.package:
    name: '{{ _etcd_packages }}'
    state: present
- name: Create etcd service group
  ansible.builtin.group:
    name: etcd
    system: true
- name: Create etcd service account
  ansible.builtin.user:
    name: etcd
    group: etcd
    system: true
    create_home: false
    shell: /usr/sbin/nologin
- name: Create protected etcd directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: etcd
    group: etcd
    mode: '0700'
  loop:
  - '{{ etcd_data_dir }}'
  - /etc/etcd
  - /var/cache/degit-etcd
- name: Install pinned etcd binaries
  ansible.builtin.import_tasks: install.yml
  when: etcd_install
- name: Record initial etcd identity
  ansible.builtin.copy:
    content: '{{ {"name": etcd_name, "token": etcd_initial_cluster_token, "members": etcd_initial_cluster} | to_json(sort_keys=true) }}

      '
    dest: '{{ etcd_data_dir }}/.degit-etcd'
    owner: etcd
    group: etcd
    mode: '0600'
    force: false
- name: Inspect current etcd service state
  ansible.builtin.service_facts: {}
- name: Remember whether etcd was already running
  ansible.builtin.set_fact:
    _etcd_was_running: '{{ ansible_facts.services.get(''etcd.service'', {}).get(''state'', ''stopped'') == ''running'' }}'
- name: Render etcd configuration
  ansible.builtin.template:
    src: etcd.yml.j2
    dest: /etc/etcd/etcd.yml
    owner: root
    group: etcd
    mode: '0640'
  notify: Restart etcd
- name: Render etcd service unit
  ansible.builtin.template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    owner: root
    group: root
    mode: '0644'
  notify:
  - Reload etcd systemd
  - Restart etcd
- name: Apply requested etcd service state
  ansible.builtin.systemd_service:
    name: etcd
    daemon_reload: true
    enabled: '{{ etcd_service_enabled }}'
    state: '{{ etcd_service_state }}'
  when: etcd_manage_service
- name: Delegate etcd client and peer port rules
  ansible.builtin.include_role:
    name: degitag.infrastructure.firewall
  vars:
    firewall_rules: '{{ etcd_firewall_sources | map(''community.general.dict_kv'', ''source'') | map(''combine'', {''port'': ''2379'', ''proto'': ''tcp'', ''action'': ''allow''}) | list + etcd_firewall_sources | map(''community.general.dict_kv'', ''source'') | map(''combine'', {''port'': ''2380'', ''proto'': ''tcp'', ''action'': ''allow''}) | list }}'
  when: etcd_manage_firewall
