---
- name: Restart redis
  ansible.builtin.service:
    name: '{{ _redis_service }}'
    state: restarted
  when:
  - redis_manage_service
  - redis_service_state == 'started'
- name: Restart redis sentinel
  ansible.builtin.service:
    name: '{{ _redis_sentinel_service }}'
    state: restarted
  when:
  - redis_manage_service
  - redis_service_state == 'started'
  - redis_sentinel_enabled
