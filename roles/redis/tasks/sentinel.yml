---
- name: Create Sentinel configuration on first installation
  ansible.builtin.copy:
    content: '# Managed settings by degitag.database; runtime state belongs to Sentinel

      '
    dest: '{{ _redis_sentinel_config }}'
    force: false
    owner: '{{ _redis_user }}'
    group: '{{ _redis_group }}'
    mode: '0640'
- name: Inspect existing Sentinel monitor declaration
  ansible.builtin.command:
    argv:
    - /usr/bin/grep
    - -E
    - ^sentinel monitor {{ redis_sentinel_master_name | regex_escape }}[[:space:]]
    - '{{ _redis_sentinel_config }}'
  register: _redis_sentinel_monitor
  changed_when: false
  failed_when: _redis_sentinel_monitor.rc not in [0, 1]
  check_mode: false
- name: Configure Sentinel fixed settings
  ansible.builtin.lineinfile:
    path: '{{ _redis_sentinel_config }}'
    regexp: ^{{ item.key | regex_escape }}\s
    line: '{{ item.key }} {{ item.value | to_json if item.key == "dir" else item.value }}'
    owner: '{{ _redis_user }}'
    group: '{{ _redis_group }}'
    mode: '0640'
  loop: '{{ {''bind'': redis_sentinel_listen, ''port'': redis_sentinel_port, ''daemonize'': ''no'', ''supervised'': ''systemd'', ''dir'': redis_sentinel_databases_dir, ''logfile'': ''""''} | combine(redis_sentinel_conf) | dict2items }}'
  notify:
  - Restart redis sentinel
- name: Declare the monitored primary only on first configuration
  ansible.builtin.lineinfile:
    path: '{{ _redis_sentinel_config }}'
    regexp: ^sentinel monitor {{ redis_sentinel_master_name | regex_escape }}\s
    line: sentinel monitor {{ redis_sentinel_master_name }} {{ redis_master_ip }} {{ redis_server_port }} {{ redis_sentinel_quorum }}
    backrefs: false
    state: present
    insertafter: EOF
  when: _redis_sentinel_monitor.stdout | length == 0
  notify:
  - Restart redis sentinel
- name: Apply explicit Sentinel authentication
  ansible.builtin.lineinfile:
    path: '{{ _redis_sentinel_config }}'
    regexp: ^sentinel auth-pass {{ redis_sentinel_master_name | regex_escape }}\s
    line: sentinel auth-pass {{ redis_sentinel_master_name }} {{ redis_server_password }}
    state: '{{ (redis_server_password | length > 0) | ternary(''present'', ''absent'') }}'
  no_log: true
  notify:
  - Restart redis sentinel
- name: Configure explicit Sentinel failure timing and overrides
  ansible.builtin.lineinfile:
    path: '{{ _redis_sentinel_config }}'
    regexp: ^sentinel {{ item.key | regex_escape }} {{ redis_sentinel_master_name | regex_escape }}\s
    line: sentinel {{ item.key }} {{ redis_sentinel_master_name }} {{ item.value }}
  loop: '{{ {''down-after-milliseconds'': redis_sentinel_downafter, ''failover-timeout'': redis_sentinel_failover_timeout} | combine(redis_sentinel_master_conf) | dict2items }}'
  notify: Restart redis sentinel
- name: Configure explicit Sentinel global overrides
  ansible.builtin.lineinfile:
    path: '{{ _redis_sentinel_config }}'
    regexp: ^sentinel {{ item.key | regex_escape }}\s
    line: sentinel {{ item.key }} {{ item.value }}
  loop: '{{ redis_sentinel_sentinel_conf | dict2items }}'
  no_log: true
  notify: Restart redis sentinel
- name: Apply requested Sentinel service state
  ansible.builtin.service:
    name: '{{ _redis_sentinel_service }}'
    state: '{{ redis_service_state }}'
    enabled: '{{ redis_service_enabled }}'
  when: redis_manage_service
