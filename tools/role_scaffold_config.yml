role_descriptions:
  mariadb: Install and configure mariadb with explicit service and data lifecycle management.
  postgresql: Install and configure postgresql with explicit service and data lifecycle management.
  redis: Install and configure redis with explicit service and data lifecycle management.
  memcached: Install and configure memcached with explicit service and data lifecycle management.
  patroni: Manage PostgreSQL high availability through Patroni and an explicit etcd-v3 DCS.
  etcd: Manage a checksum-pinned etcd consensus cluster for Patroni.
role_notes:
  mariadb: Native distribution packages replace implicit upstream repositories. Root socket authentication remains enabled by default. Initialization, replication, encryption and backups require explicit inputs. Existing encryption keys are never automatically rotated or overwritten.
  postgresql: Standalone mode uses native distribution packages. Set postgresql_initialize=true for a new cluster. In HA mode use degitag.database.patroni instead; it prepares PostgreSQL packages with a single service owner. Major upgrades, uninstall and legacy manual replication are never implicit. Backups and restore tests require separate opt-ins.
  redis: Native distribution services replace custom instance units. With Sentinel enabled, Redis runtime configuration is rendered only on first handover; Sentinel owns subsequent primary/replica changes. Normal reruns preserve CONFIG REWRITE and failover state. Configuration or credential rotation requires explicit redis_sentinel_allow_reconfigure=true with inputs reflecting the current topology.
  memcached: Service tasks and handlers honor manage_service, service_enabled and service_state. Optional port rules delegate to degitag.infrastructure.firewall. Review docs/migration.md before changing an existing installation.
  patroni: Patroni is the sole owner of PostgreSQL start, stop, leader election and replication in HA mode. Bootstrap and adoption require explicit flags. bootstrap.dcs only initializes a new DCS scope; use patronictl edit-config for changes to an existing cluster. No automatic data-directory deletion or DCS reset is performed.
  etcd: Initial membership is a bootstrap input. Membership changes require an explicit etcdctl member add/remove procedure and quorum review. TLS and client/peer authentication are enabled by default; certificates are supplied by the operator. Installation of external release binaries requires etcd_install=true. Release assets are provided for x86_64 and aarch64; ARM execution requires a separate runtime acceptance test.
