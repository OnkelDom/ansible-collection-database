role_example_playbooks:
  etcd: "# Required cluster addresses, PKI and Vault inputs: docs/patroni.md.\n- name: Configure etcd\n  hosts: database_ha\n  become: true\n  gather_facts: true\n  roles:\n  - role: degitag.database.etcd"
  mariadb: "- name: Configure MariaDB\n  hosts: mariadb_servers\n  become: true\n  gather_facts: true\n  roles:\n  - role: degitag.database.mariadb\n    vars:\n      mariadb_initialize: true\n      mariadb_users:\n      - name: application\n        password: \"{{ vault_application_db_password }}\"\n        priv: application.*:ALL\n      mariadb_databases:\n      - name: application"
  memcached: "- name: Configure a local application cache\n  hosts: memcached_servers\n  become: true\n  gather_facts: true\n  roles:\n  - role: degitag.database.memcached\n    vars:\n      memcached_memory: 128\n      memcached_listen: [127.0.0.1]"
  patroni: "# Required cluster addresses, PKI and Vault inputs: docs/patroni.md.\n- name: Configure patroni\n  hosts: database_ha\n  become: true\n  gather_facts: true\n  roles:\n  - role: degitag.database.patroni"
  postgresql: "- name: Configure PostgreSQL\n  hosts: postgresql_servers\n  become: true\n  gather_facts: true\n  roles:\n  - role: degitag.database.postgresql\n    vars:\n      postgresql_initialize: true\n      postgresql_users:\n      - name: application\n        password: \"{{ vault_application_db_password }}\"\n      postgresql_databases:\n      - name: application\n        owner: application"
  redis: "- name: Configure a local application cache\n  hosts: redis_servers\n  become: true\n  gather_facts: true\n  roles:\n  - role: degitag.database.redis\n    vars:\n      redis_conf:\n        maxmemory: 256mb\n        maxmemory-policy: allkeys-lru"
role_licenses:
  mariadb: MPL-2.0
  postgresql: MPL-2.0
  redis: MPL-2.0
  memcached: MPL-2.0
